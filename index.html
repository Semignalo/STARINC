<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C5A059" />

    <!-- Preconnect: mulai TCP/TLS handshake parallel dengan parsing HTML -->
    <link rel="preconnect" href="http://127.0.0.1:8000">
    <link rel="dns-prefetch" href="http://127.0.0.1:8000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Cloudinary: preconnect untuk speed up first image load -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="dns-prefetch" href="https://res.cloudinary.com">

    <!-- Font: non-blocking load, hanya 2 weight (400+700) untuk reduce payload -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
    >
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      media="print"
      onload="this.media='all'"
    >
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      >
    </noscript>

    <title>STARINC</title>

    <!-- Instant skeleton — tampil sebelum JS bundle parse selesai -->
    <style>
      @keyframes starinc-spin { to { transform: rotate(360deg); } }
      #starinc-boot {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        z-index: 9999;
      }
      #starinc-boot .ring {
        width: 44px; height: 44px;
        border: 3px solid #eee;
        border-top-color: #C5A059;
        border-radius: 50%;
        animation: starinc-spin 0.8s linear infinite;
        margin: 0 auto;
      }
      #starinc-boot p {
        margin-top: 18px;
        color: #999;
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="starinc-boot">
        <div style="text-align:center">
          <div class="ring"></div>
          <p>STARINC</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
